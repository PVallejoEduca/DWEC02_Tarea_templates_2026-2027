<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Identidad Visual - DWEC</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <div class="nav-center">
            <h4 id="tituloPagina">GENERADOR DE IDENTIDAD VISUAL</h4>
        </div>
    </nav>

    <main>
        <section class="identity-card" id="tarjetaIdentidad">
            <div class="identity-badge">DWEC ID</div>

            <h1 id="nombreIdentidad">NÓMADA PIXEL</h1>

            <div class="code-box">
                <span class="label">Código</span>
                <strong id="codigoIdentidad">X7P2K9</strong>
            </div>

            <div class="color-info">
                <p>
                    Fondo:
                    <span id="colorFondo">#55B2D6</span>
                </p>
                <p>
                    Texto:
                    <span id="colorTexto">#172554</span>
                </p>
            </div>

            <button class="btn btn-hero" id="btn" onclick="generarIdentidad()">
                Generar identidad
            </button>
        </section>
    </main>

    <!--
        Añade aquí la etiqueta <script> necesaria para enlazar index.js.
        No modifiques el resto de la estructura HTML.
    -->
</body>

</html>
